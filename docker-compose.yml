services:
  mongo:
    image: mongo:7
    container_name: carelink-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carelink
    networks:
      - carelink
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 8

  ipfs:
    image: ipfs/kubo@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    container_name: carelink-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - carelink

  fhir:
    image: hapiproject/hapi@sha256:d7f38d3676900b07e8a7d3500426eaf8d90ea9ced9a6726416f080f68e230fb0
    container_name: carelink-fhir
    restart: unless-stopped
    ports:
      - "8090:8080"
    networks:
      - carelink


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carelink-backend
    restart: unless-stopped
    env_file:
      - .env
      - backend/.env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - carelink
    volumes:
      - ./blockchain/fabric/network/organizations:/app/blockchain/fabric/network/organizations:ro
      - ./backend/ssi.sqlite:/app/backend/ssi.sqlite
    depends_on:
      mongo:
        condition: service_healthy
      ipfs:
        condition: service_healthy

volumes:
  mongo_data:
  ipfs_staging:
  ipfs_data:


networks:
  carelink:
    external: true
