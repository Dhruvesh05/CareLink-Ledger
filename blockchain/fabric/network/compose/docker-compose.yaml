services:

  orderer.carelink.com:
    container_name: orderer.carelink.com
    image: hyperledger/fabric-orderer:2.5.16

    environment:
      - FABRIC_LOGGING_SPEC=INFO

      # General orderer configuration
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050

      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp

      # General TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]

      # Channel participation mode
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true

      # Orderer Admin API
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]

    working_dir: /var/hyperledger/orderer

    command: orderer

    volumes:
      - ../organizations/ordererOrganizations/carelink.com/orderers/orderer.carelink.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/carelink.com/orderers/orderer.carelink.com/tls:/var/hyperledger/orderer/tls
      - ../organizations/ordererOrganizations/carelink.com/orderers/orderer.carelink.com/msp:/var/hyperledger/orderer/orderer/msp
      - orderer-data:/var/hyperledger/production/orderer

    ports:
      - "7050:7050"
      - "9443:9443"

    networks:
      - carelink


  peer0.carelink.com:
    container_name: peer0.carelink.com
    image: hyperledger/fabric-peer:2.5.16

    environment:
      - FABRIC_LOGGING_SPEC=INFO

      # Peer identity
      - CORE_PEER_ID=peer0.carelink.com
      - CORE_PEER_ADDRESS=peer0.carelink.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051

      # Organization
      - CORE_PEER_LOCALMSPID=CareLinkMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp

      # Peer TLS
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt

      # Chaincode
      - CORE_PEER_CHAINCODEADDRESS=peer0.carelink.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052

      # Docker chaincode execution
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=carelink

    working_dir: /var/hyperledger

    command: peer node start

    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/carelink.com/peers/peer0.carelink.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/carelink.com/peers/peer0.carelink.com/tls:/etc/hyperledger/fabric/tls
      - peer0-data:/var/hyperledger/production

    ports:
      - "7051:7051"
      - "7052:7052"

    networks:
      - carelink


networks:
  carelink:
    name: carelink


volumes:
  orderer-data:
  peer0-data: